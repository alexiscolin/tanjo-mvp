[build]
  command = "pnpm build"
  publish = ".next"
  environment = { SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_EXCHANGE_RATE_API_URL,SITE_URL,NEXT_PUBLIC_SITE_URL" }

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Env Vars (to configure in Netlify UI)
# GOOGLE_SHEETS_SPREADSHEET_ID
# GOOGLE_SHEETS_CLIENT_EMAIL
# GOOGLE_PRIVATE_KEY
# ADMIN_PASSWORD
# SESSION_SECRET (required - to generate with: openssl rand -hex 32)
# RESEND_API_KEY (optionnal)
# NEXT_PUBLIC_EXCHANGE_RATE_API_URL (optionnal)

# Headers to optimize CDN
[[headers]]
  for = "/api/exchange-rate"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"
    # Cache 24h

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    # Assets statiques: cache 1 an
